<template id="tpl-topic">
  <blockquote class="topic-q reveal-up">
    <span class="mono kicker">ITRE · Topic question</span>
    <p><b>Powering the Cloud:</b> with the electricity demand of data centres in the EU set to rise sharply by 2030, largely driven by AI, how should the EU balance its <em>digital competitiveness</em> with its <em>climate targets</em>, <em>grid stability</em> and the interests of <em>local communities</em>?</p>
  </blockquote>

  <div class="facts">
    <div class="fact tilt reveal-up">
      <div class="fact-n"><b data-count="415">0</b><small>TWh</small></div>
      <p>Electricity used by data centres worldwide in 2024 — about <b>1.5%</b> of all electricity on Earth.</p>
      <span class="src mono">Source: IEA, Energy and AI (2025)</span>
    </div>
    <div class="fact tilt reveal-up">
      <div class="fact-n"><span>×</span><b data-count="2">0</b></div>
      <p>The IEA expects that to roughly <b>double by 2030</b> (to around 945 TWh) — AI is the main driver.</p>
      <span class="src mono">Source: IEA, Energy and AI (2025)</span>
    </div>
    <div class="fact tilt reveal-up">
      <div class="fact-n"><span>~</span><b data-count="21">0</b><small>%</small></div>
      <p>Share of Ireland's metered electricity used by data centres in 2023. One country, one sector, one fifth.</p>
      <span class="src mono">Source: CSO Ireland (2024)</span>
    </div>
  </div>

  <div class="video-card reveal-up" id="to-video">
    <div class="vc-screen">
      <video id="to-player" controls playsinline preload="none" poster=""></video>
      <div class="vc-placeholder" id="vc-ph">
        <div class="vc-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <p class="mono">TOPIC OVERVIEW VIDEO</p>
        <h3>Premieres Monday · 09:30</h3>
        <p class="muted">Watch it together in committee. It lands here afterwards.</p>
      </div>
    </div>
  </div>

  <div class="flow-explain reveal-up">
    <h3 class="h3">How a data centre turns into a political problem</h3>
    <ol class="chain">
      <li><b>AI boom</b><span>Training and running AI models needs huge amounts of computing.</span></li>
      <li><b>More data centres</b><span>Companies build bigger sites, often near big cities and cables.</span></li>
      <li><b>Grid pressure</b><span>One large site can need as much power as a small city — the cables and substations can't keep up.</span></li>
      <li><b>Conflict</b><span>Households, factories, renewables and data centres all want the same limited connection capacity.</span></li>
      <li><b>Policy</b><span>That's where you come in: the EU has to decide the rules.</span></li>
    </ol>
  </div>
</template>

<template id="tpl-conflicts">
  <div class="conflicts">
    <article class="conflict tilt" style="--c:#3df2ff">
      <div class="cf-letter">A</div>
      <h3>Competitiveness <i>vs</i> climate</h3>
      <div class="beam"><span class="l">More AI in Europe</span><span class="pivot"></span><span class="r">Climate neutral by 2050</span></div>
      <p>The EU wants its own AI and cloud industry instead of depending on the US and China. But every new data centre needs clean power that is also wanted by homes, trains and heat pumps.</p>
      <p class="ask mono">Ask: Should growth wait for clean energy — or the other way round?</p>
    </article>
    <article class="conflict tilt" style="--c:#ffe14d">
      <div class="cf-letter">B</div>
      <h3>The grid <i>&amp;</i> local people</h3>
      <div class="beam"><span class="l">Jobs, tax, investment</span><span class="pivot"></span><span class="r">Power, water, land, noise</span></div>
      <p>A data centre brings investment but few jobs, uses grid capacity, sometimes water for cooling, and land. Dublin and Amsterdam have at times paused new data-centre connections.</p>
      <p class="ask mono">Ask: Who should be first in the queue for the grid?</p>
    </article>
    <article class="conflict tilt" style="--c:#ff3d7f">
      <div class="cf-letter">C</div>
      <h3>Transparency <i>vs</i> trade secrets</h3>
      <div class="beam"><span class="l">Public right to know</span><span class="pivot"></span><span class="r">Company secrets</span></div>
      <p>The EU now asks big data centres to report their energy and water use. Companies say detailed numbers reveal business secrets; citizens say you can't fix what you can't see.</p>
      <p class="ask mono">Ask: What exactly should be public, and to whom?</p>
    </article>
    <article class="conflict tilt" style="--c:#4dffa6">
      <div class="cf-letter">D</div>
      <h3>Voluntary <i>vs</i> binding</h3>
      <div class="beam"><span class="l">Industry pledges</span><span class="pivot"></span><span class="r">Hard EU law</span></div>
      <p>The industry signed a voluntary Climate Neutral Data Centre Pact. Some countries (like Germany) set binding efficiency limits. Is a promise enough?</p>
      <p class="ask mono">Ask: Carrot, stick — or both?</p>
    </article>
  </div>
  <div class="already reveal-up">
    <h3 class="h3">What already exists (don't reinvent it — build on it)</h3>
    <div class="ex-grid">
      <div><b>Energy Efficiency Directive (2023)</b><span>Data centres from 500 kW must report energy, water and waste-heat data every year to an EU database.</span></div>
      <div><b>Climate Neutral Data Centre Pact (2021)</b><span>Voluntary industry pledge: climate-neutral data centres by 2030.</span></div>
      <div><b>German Energy Efficiency Act (2023)</b><span>National, binding efficiency and waste-heat rules for data centres.</span></div>
      <div><b>AI Continent Action Plan (2025)</b><span>The Commission wants much more AI computing capacity in Europe — "AI gigafactories".</span></div>
    </div>
  </div>
</template>
