<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Terms · ITRE</title>
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
:root { --bg:#04060d; --ink:#eaf0ff; --ink-2:#b6c0e3; --muted:#7b87b3; --cyan:#3df2ff; --volt:#ffe14d; --pink:#ff3d7f; --green:#4dffa6; --violet:#9b7bff; --orange:#ff8a3d;
  --sans:'Archivo',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
body::before { content: ''; position: fixed; inset: -50%; background-image: linear-gradient(rgba(110,140,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(110,140,255,.07) 1px, transparent 1px); background-size: 60px 60px; animation: drift 40s linear infinite; }
@keyframes drift { to { transform: translate(60px, 60px); } }
.glow { position: fixed; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(120px); opacity: .22; background: var(--c, var(--cyan)); left: 50%; top: 50%; transform: translate(-50%, -50%); transition: background .8s; pointer-events: none; }
.slide { position: fixed; inset: 0; display: grid; place-items: center; padding: 7vh 7vw 10vh; visibility: hidden; }
.slide.on { visibility: visible; }
.top { position: fixed; left: 3vw; top: 3vh; font: 500 clamp(12px, 1.4vw, 22px) var(--mono); letter-spacing: .2em; color: var(--muted); z-index: 2; }
.top b { color: var(--c, var(--cyan)); }
.bar { position: fixed; left: 0; bottom: 0; height: 6px; background: var(--c, var(--cyan)); box-shadow: 0 0 20px var(--c, var(--cyan)); transition: width .5s cubic-bezier(.2,.8,.2,1), background .8s; z-index: 2; }
.hint { position: fixed; right: 3vw; bottom: 2.4vh; font: 500 clamp(11px, 1.1vw, 18px) var(--mono); color: var(--muted); z-index: 2; }
.fs { position: fixed; right: 3vw; top: 2.4vh; z-index: 3; background: none; border: 1px solid rgba(110,140,255,.3); color: var(--ink-2); font: 500 14px var(--mono); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
/* title */
.title { text-align: center; }
.title .k { font: 500 clamp(16px, 2vw, 32px) var(--mono); letter-spacing: .3em; color: var(--cyan); }
.title h1 { margin: 2vh 0; font-size: clamp(60px, 11vw, 220px); line-height: .95; font-weight: 900; letter-spacing: -.03em; text-shadow: 0 0 60px rgba(61,242,255,.4); }
.title p { font-size: clamp(20px, 2.4vw, 44px); color: var(--ink-2); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 1.2vw; justify-content: center; margin-top: 5vh; max-width: 80vw; }
.chips span { font-size: clamp(26px, 3.4vw, 60px); width: 1.8em; height: 1.8em; display: grid; place-items: center; border-radius: 22%; background: rgba(255,255,255,.05); border: 1px solid rgba(110,140,255,.25); }
/* term */
.term { width: min(1500px, 100%); display: grid; grid-template-columns: auto 1fr; gap: 4vw; align-items: center; }
.ic { font-size: clamp(90px, 14vw, 280px); width: 1.35em; height: 1.35em; display: grid; place-items: center; border-radius: 28%; border: 4px solid var(--c); background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 35%, transparent), transparent 70%); box-shadow: 0 0 60px color-mix(in srgb, var(--c) 45%, transparent); animation: bob 3s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-14px) rotate(-3deg); } }
.no { font: 500 clamp(14px, 1.6vw, 26px) var(--mono); letter-spacing: .2em; color: var(--c); }
.term h2 { margin: 1vh 0 2vh; font-size: clamp(48px, 7vw, 140px); line-height: .98; font-weight: 900; letter-spacing: -.02em; }
.guess { font-size: clamp(24px, 3vw, 56px); color: var(--volt); font-weight: 800; }
.def { font-size: clamp(24px, 2.9vw, 54px); line-height: 1.25; font-weight: 600; color: var(--ink); margin: 0; }
.ex { margin-top: 3vh; padding: 2.2vh 2vw; border-radius: 22px; border: 2px solid color-mix(in srgb, var(--c) 60%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); font-size: clamp(20px, 2.4vw, 44px); line-height: 1.3; }
.ex b { display: block; font: 500 clamp(12px, 1.3vw, 22px) var(--mono); letter-spacing: .2em; color: var(--c); margin-bottom: .6vh; }
.hide { display: none; }
@media (max-aspect-ratio: 1/1) { .term { grid-template-columns: 1fr; text-align: center; } .ic { margin: 0 auto; } }
</style>
</head>
<body>
<div class="glow" id="glow"></div>
<div class="top" id="top">ITRE · <b>KEY TERMS</b></div>
<button class="fs" id="fs">⛶ Full screen</button>
<div id="deck"></div>
<div class="bar" id="bar"></div>
<div class="hint">→ / click = next · ← = back</div>
<script src="../assets/js/motion.js"></script>
<script src="../assets/js/content.js?v=3"></script>
<script>
(() => {
  const T = window.GL_TERMS, COLS = ['#3df2ff', '#ffe14d', '#ff3d7f', '#4dffa6', '#9b7bff', '#ff8a3d'];
  const { animate, stagger } = window.Motion || {};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const deck = document.getElementById('deck');
  // every term = 3 beats: guess → definition → example
  const beats = [{ s: 0, b: 0 }];
  deck.insertAdjacentHTML('beforeend', `<section class="slide" style="--c:${COLS[0]}"><div class="title"><div class="k">ITRE · DAY 2</div><h1>Key Terms</h1><p>${T.length} words you need for this committee</p><div class="chips">${T.map(t => `<span>${t.ic}</span>`).join('')}</div></div></section>`);
  T.forEach((t, i) => {
    const c = COLS[i % COLS.length];
    deck.insertAdjacentHTML('beforeend', `<section class="slide" style="--c:${c}"><div class="term"><div class="ic">${t.ic}</div><div>
      <div class="no">TERM ${i + 1} / ${T.length}</div><h2>${esc(t.t)}</h2>
      <div class="guess">What does it mean? 🤔</div>
      <p class="def hide">${esc(t.d)}</p>
      <div class="ex hide"><b>EXAMPLE</b>${esc(t.ex)}</div></div></div></section>`);
    [0, 1, 2].forEach(b => beats.push({ s: i + 1, b }));
  });
  deck.insertAdjacentHTML('beforeend', `<section class="slide" style="--c:${COLS[3]}"><div class="title"><div class="k">YOUR TURN</div><h1>Quiz time ⚡</h1><p>Phones out — test yourself on all ${T.length} terms</p></div></section>`);
  beats.push({ s: T.length + 1, b: 0 });
  const slides = [...deck.children];
  let k = -1, curS = -1;
  function go(n) {
    n = Math.max(0, Math.min(n, beats.length - 1)); if (n === k) return;
    const fwd = n > k; k = n; const { s, b } = beats[k]; const el = slides[s];
    if (s !== curS) {
      slides.forEach(x => x.classList.toggle('on', x === el)); curS = s;
      const c = el.style.getPropertyValue('--c'); document.documentElement.style.setProperty('--c', c);
      if (animate) {
        animate(el.querySelectorAll('.ic, .chips span'), { scale: [0.3, 1], rotate: [-20, 0], opacity: [0, 1] }, { type: 'spring', bounce: .45, delay: stagger ? stagger(.04) : 0 });
        animate(el.querySelectorAll('.no, h1, h2, .k, .title p, .guess'), { y: [50, 0], opacity: [0, 1] }, { duration: .6, ease: [.2, .8, .2, 1], delay: stagger ? stagger(.08, { startDelay: .1 }) : 0 });
      }
    }
    const g = el.querySelector('.guess'), d = el.querySelector('.def'), ex = el.querySelector('.ex');
    if (g) {
      g.classList.toggle('hide', b !== 0); d.classList.toggle('hide', b < 1); ex.classList.toggle('hide', b < 2);
      if (fwd && animate && b === 1) animate(d, { y: [30, 0], opacity: [0, 1], filter: ['blur(8px)', 'blur(0px)'] }, { duration: .55 });
      if (fwd && animate && b === 2) animate(ex, { scale: [.85, 1], opacity: [0, 1] }, { type: 'spring', bounce: .4 });
      if (!fwd && animate) animate([d, ex].filter(x => !x.classList.contains('hide')), { opacity: [.4, 1] }, { duration: .3 });
    }
    document.getElementById('bar').style.width = (k / (beats.length - 1) * 100) + '%';
    try { history.replaceState(null, '', '#' + k); } catch (e) {}
  }
  addEventListener('keydown', e => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(k + 1); }
    if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(k - 1); }
    if (e.key === 'Home') go(0); if (e.key === 'End') go(beats.length - 1);
    if (e.key === 'f') document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  });
  addEventListener('click', e => { if (e.target.closest('.fs')) return; go(e.clientX < innerWidth * 0.25 ? k - 1 : k + 1); });
  let sx = null; addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) { e.preventDefault(); go(k + (dx < 0 ? 1 : -1)); } sx = null; });
  document.getElementById('fs').addEventListener('click', () => { const d = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen && d.requestFullscreen(); });
  go(parseInt(location.hash.slice(1)) || 0);
})();
</script>
</body>
</html>
